recommendations:
  - Declare 401 (and 429, and 5xx) responses on both operations in the OpenAPI.
  - Return HTTP 404 for unrouted paths instead of HTTP 200.
  - Add a stable machine-readable `code` to the error envelope, or adopt RFC 9457 problem+json.
  - Unify the `error` / `message` envelope keys.
