name: Secton API
description: >-
  Secton API is the OpenAI-compatible inference surface from Secton, a small developer-tools company
  operating at secton.org. It publishes two REST operations — POST /v1/chat/completions, with optional
  incremental streaming, and GET /v1/models — behind a static API key issued in the Secton Console and
  sent in the Authorization header. A first-party TypeScript SDK ("secton" on npm) wraps chat, model
  listing, credit usage and client-side conversation context management. Secton announced a permanent
  shutdown of the API on 2025-11-18 with an end date of 2025-12-19, yet the host, the OpenAPI and the
  status page remain live and the Console Terms of Service governing API keys were re-issued effective
  2026-08-06 — see lifecycle/secton-api-lifecycle.yml before building on it.
